[project]
name = "template-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "tortoise-orm[asyncpg]>=1.1.8",
    "aerich>=0.10.1",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "user-agents>=2.2.0",
    "fastapi-pagination>=0.15.16",
    "tzdata>=2026.3",
    "fastapi-idempotency[tortoise]>=0.1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "basedpyright>=1.40.0",
]

[tool.aerich]
tortoise_orm = "app.core.database.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.core.dependencies.requires"]

[tool.basedpyright]
include = ["app"]
exclude = ["migrations", ".venv"]
typeCheckingMode = "standard"
reportDeprecated = "warning"
pythonVersion = "3.14"

[tool.fastapi]
entrypoint = "app.main:app"
